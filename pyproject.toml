[project]
name = "finresearch-agent"
version = "0.1.0"
description = "Multi-agent A-share research system with a PIT data platform and an agent evaluation platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "langgraph>=0.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["akshare>=1.12"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
data_platform = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
