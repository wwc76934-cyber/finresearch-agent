[project]
name = "finresearch-agent"
version = "0.1.0"
description = "Multi-agent A-share research system with a PIT data platform and an agent evaluation platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "langgraph>=0.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "langgraph-checkpoint-sqlite>=2.0",
  "reportlab>=4.0",
  "scipy>=1.11",
  "psycopg[binary]>=3.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]
live = ["akshare>=1.12"]
postgres = ["psycopg[binary]>=3.1"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
data_platform = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = "packages"
explicit_package_bases = true
namespace_packages = true

# Type-debt baseline (2026-11-18): these modules had errors before mypy was first run. They are not hidden: the count
# is in docs/PROJECT_STATUS.md. New and rewritten modules must NOT be added to this list.
[[tool.mypy.overrides]]
module = [
  "agent_runtime.agents.collectors",
  "agent_runtime.agents.debate",
  "agent_runtime.agents.faults",
  "agent_runtime.agents.planner",
  "agent_runtime.agents.report",
  "agent_runtime.agents.risk",
  "agent_runtime.agents.semantic_probe",
  "agent_runtime.agents.verifier",
  "agent_runtime.baselines",
  "agent_runtime.context",
  "agent_runtime.graph",
  "agent_runtime.pdf_export",
  "agent_runtime.react_agent",
  "apps.api_server.main",
  "data_platform.anomaly_stats",
  "data_platform.calculators",
  "data_platform.factors",
  "data_platform.providers",
  "data_platform.versioning",
  "evaluation_platform.datasets",
  "evaluation_platform.judges",
  "evaluation_platform.quant_oracle",
  "evaluation_platform.rag_eval",
  "evaluation_platform.tracing",
  "rag_engine.chunking",
  "rag_engine.pdf_parser",
  "rag_engine.retrieval",
]
ignore_errors = true
