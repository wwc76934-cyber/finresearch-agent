# Declarative Metric Registry (Data Catalog). Formulas are documentation of
# what packages/data_platform/calculators.py computes; formula_version is
# written into every MetricRecord and lineage edge.
base_items:
  operating_revenue: {cn: 营业收入, kind: flow}
  operating_cost: {cn: 营业成本, kind: flow}
  rd_expense: {cn: 研发费用, kind: flow}
  asset_impairment_loss: {cn: 资产减值损失, kind: flow}
  net_profit: {cn: 归属于母公司股东的净利润, kind: flow}
  operating_cash_flow: {cn: 经营活动产生的现金流量净额, kind: flow}
  accounts_receivable: {cn: 应收账款, kind: instant}
  inventory: {cn: 存货, kind: instant}
  total_assets: {cn: 资产总计, kind: instant}
  total_liabilities: {cn: 负债合计, kind: instant}
  total_equity: {cn: 所有者权益合计, kind: instant}
  interest_bearing_debt: {cn: 有息负债, kind: instant}
  goodwill: {cn: 商誉, kind: instant}
  cash: {cn: 货币资金, kind: instant}
  shares_outstanding: {cn: 总股本, kind: instant}
  parent_equity: {cn: 归属于母公司股东权益, kind: instant}
  total_profit: {cn: 利润总额, kind: flow}
  interest_expense: {cn: 利息费用, kind: flow}
  depreciation_amortization: {cn: 折旧与摊销, kind: flow}

derived:
  gross_margin: {cn: 毛利率, formula: "(operating_revenue - operating_cost) / operating_revenue", unit: ratio, version: v1}
  net_margin: {cn: 净利率, formula: "net_profit / operating_revenue", unit: ratio, version: v1}
  rd_ratio: {cn: 研发费用率, formula: "rd_expense / operating_revenue", unit: ratio, version: v1}
  roe_annualized: {cn: ROE(年化), formula: "net_profit * 4/n_quarters / avg(total_equity_begin, total_equity_end)", unit: ratio, version: v1}
  ocf_to_net_profit: {cn: 经营现金流/净利润, formula: "operating_cash_flow / net_profit", unit: ratio, version: v1}
  debt_to_assets: {cn: 资产负债率, formula: "total_liabilities / total_assets", unit: ratio, version: v1}
  interest_debt_ratio: {cn: 有息负债率, formula: "interest_bearing_debt / total_assets", unit: ratio, version: v1}
  receivable_days: {cn: 应收账款周转天数, formula: "accounts_receivable / revenue_ttm * 365", unit: days, version: v1}
  inventory_days: {cn: 存货周转天数, formula: "inventory / cost_ttm * 365", unit: days, version: v1}
  factor_rank_ic_mean: {cn: "因子RankIC均值", formula: "mean over quarterly cross-sections of spearman(factor, forward_return)", unit: ic, version: v1}
  factor_ic_mean: {cn: "因子IC均值", formula: "mean over quarterly cross-sections of pearson(factor, forward_return)", unit: ic, version: v1}
  factor_rank_ic_ir: {cn: "RankIC_IR", formula: "mean(RankIC) / std(RankIC)", unit: ic, version: v1}
  factor_rank_ic_t: {cn: "RankIC的t统计量", formula: "one-sample t-test of RankIC series against 0", unit: stat, version: v1}
  factor_rank_ic_p: {cn: "RankIC的p值", formula: "two-sided p-value of that t-test", unit: stat, version: v1}
  factor_ls_mean: {cn: "最高组减最低组每期收益", formula: "mean(top group return - bottom group return)", unit: ratio, version: v1}
  factor_ls_cum: {cn: "多空组合累计收益", formula: "prod(1 + long_short_k) - 1", unit: ratio, version: v1}
  factor_ls_mdd: {cn: "多空组合最大回撤", formula: "min(nav / running_peak - 1)", unit: ratio, version: v1}
  factor_n_stocks: {cn: "每截面公司数(中位数)", formula: "median number of companies with a valid factor and forward return", unit: count, version: v1}
  factor_horizon_days: {cn: "持有交易日数", formula: "forward_horizon_days parameter", unit: count, version: v1}
  factor_quantiles: {cn: "分组数", formula: "quantiles parameter", unit: count, version: v1}
  factor_n_cs: {cn: "截面个数", formula: "number of usable quarterly cross-sections", unit: count, version: v1}
  factor_group_return: {cn: "分组平均后续收益", formula: "mean forward return of the group, averaged over cross-sections", unit: ratio, version: v1}
  revenue_yoy: {cn: 营收同比, formula: "cum_t / cum_{t-1y} - 1", unit: ratio, version: v1}
  net_profit_yoy: {cn: 净利润同比, formula: "cum_t / cum_{t-1y} - 1 (NA if base <= 0)", unit: ratio, version: v1}
  ocf_yoy: {cn: 经营现金流同比, formula: "cum_t / cum_{t-1y} - 1 (NA if base <= 0)", unit: ratio, version: v1}
  receivable_yoy: {cn: 应收账款同比, formula: "ar_t / ar_{t-1y} - 1", unit: ratio, version: v1}
  single_quarter: {cn: 单季值, formula: "cum_q - cum_{q-1}; flagged if earlier cum restated after later cum was published", unit: CNY, version: v1}
  ttm: {cn: TTM, formula: "annual_{y-1} - cum_{q,y-1} + cum_{q,y}", unit: CNY, version: v1}
  pe_ttm: {cn: 市盈率TTM, formula: "total_mv / net_profit_ttm (NA if <= 0)", unit: x, version: v1}
  pb_lf: {cn: 市净率LF, formula: "total_mv / total_equity_latest (NA if <= 0)", unit: x, version: v1}
  ps_ttm: {cn: 市销率TTM, formula: "total_mv / revenue_ttm", unit: x, version: v1}
  pe_percentile_3y: {cn: PE 3年分位, formula: "rank of today's PE among month-end PE over 3y", unit: ratio, version: v1}
  pe_percentile_5y: {cn: PE 5年分位, formula: "rank of today's PE among month-end PE over 5y (NA if < 48 months)", unit: ratio, version: v1}
  ev_ebitda: {cn: EV/EBITDA, formula: "(total_mv + interest_bearing_debt - cash) / (total_profit_ttm + interest_expense_ttm + d&a_ttm)", unit: x, version: v1}
  revenue_qoq: {cn: 营收环比, formula: "single_quarter_t / single_quarter_{t-1} - 1", unit: ratio, version: v1}
  net_profit_qoq: {cn: 净利润环比, formula: "single_quarter_t / single_quarter_{t-1} - 1 (NA if base <= 0)", unit: ratio, version: v1}
  dcf_value_per_share: {cn: DCF每股价值, formula: "sum FCF_0*(1+g)^t/(1+wacc)^t, t=1..n + TV/(1+wacc)^n, TV=FCF_n*(1+g_inf)/(wacc-g_inf); per share", unit: CNY, version: v1}
  peer_pe_median: {cn: 同行PE中位数, formula: "median PE-TTM of same SW L2 peers (falls back to L1)", unit: x, version: v1}
  threshold_gross_margin: {cn: 毛利率证伪阈值, formula: "gross_margin - 2pp", unit: ratio, version: v1}
  threshold_ocf_to_net_profit: {cn: 现金流/净利润证伪阈值, formula: "0.8", unit: ratio, version: v1}
  threshold_receivable_days: {cn: 应收周转天数证伪阈值, formula: "receivable_days * 1.1", unit: days, version: v1}
  threshold_interest_debt_ratio: {cn: 有息负债率证伪阈值, formula: "interest_debt_ratio + 5pp", unit: ratio, version: v1}
  volatility_1y: {cn: 年化波动率, formula: "std(log returns 250d) * sqrt(252)", unit: ratio, version: v1}
  max_drawdown_1y: {cn: 最大回撤(1年), formula: "min(close / cummax(close) - 1)", unit: ratio, version: v1}

templates:
  manufacturing: [gross_margin, net_margin, rd_ratio, roe_annualized, ocf_to_net_profit, debt_to_assets,
                  interest_debt_ratio, receivable_days, inventory_days]
  consumer: [gross_margin, net_margin, roe_annualized, ocf_to_net_profit, debt_to_assets, receivable_days, inventory_days]
  bank: [net_interest_margin, npl_ratio, provision_coverage, capital_adequacy, roe_annualized]
  insurance: [combined_ratio, solvency_ratio, roe_annualized]
  broker: [roe_annualized, leverage, fee_income_share]
